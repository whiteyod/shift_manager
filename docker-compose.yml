services:
  db:
    image: postgres:16
    container_name: shiftplanner-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shiftplanner
    ports:
      - "5432:5432"
    volumes:
      - shiftplanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiftplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shiftplanner_pgdata: